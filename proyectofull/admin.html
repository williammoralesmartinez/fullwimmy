<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración | Vimmy</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link rel="stylesheet" href="assets/css/styles.css"></head><body><section class="admin-heading text-white py-5"><div class="container d-flex flex-wrap justify-content-between align-items-center gap-3"><div><span class="eyebrow">PANEL VIMMY</span><h1 class="fw-bold">Inventario de snacks</h1></div><div class="d-flex gap-2"><a class="btn btn-outline-light" href="index.html">Tienda</a><button class="btn btn-light" onclick="logout()">Salir</button><button class="btn btn-vimmy" data-bs-toggle="modal" data-bs-target="#productModal" onclick="openCreate()">+ Nuevo producto</button></div></div></section><main class="container py-5"><div id="adminAlert"></div><div class="table-responsive bg-white shadow-sm rounded-4"><table class="table align-middle mb-0"><thead><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Stock</th><th></th></tr></thead><tbody id="productsTable"></tbody></table></div></main>
<div class="modal fade" id="productModal"><div class="modal-dialog modal-lg"><div class="modal-content rounded-4"><div class="modal-header"><h5 id="modalTitle">Nuevo producto</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><form id="productForm"><div class="modal-body"><input type="hidden" id="productId"><div class="row g-3"><div class="col-md-6"><label class="form-label">Nombre</label><input id="name" class="form-control" required></div><div class="col-md-6"><label class="form-label">Categoría</label><input id="category" class="form-control" required></div><div class="col-md-6"><label class="form-label">Precio</label><input id="price" type="number" class="form-control" required></div><div class="col-md-6"><label class="form-label">Stock</label><input id="stock" type="number" class="form-control" required></div><div class="col-12"><label class="form-label">Imagen URL</label><input id="image_url" class="form-control"></div><div class="col-12"><label class="form-label">Descripción</label><textarea id="description" class="form-control" rows="3"></textarea></div></div></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-vimmy">Guardar</button></div></form></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="assets/js/config.js"></script><script src="assets/js/common.js"></script><script src="assets/js/admin.js"></script></body></html>
